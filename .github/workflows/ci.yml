# Fetches the toolchain (tools/toolchain.ps1), builds everything and runs the Rust and D3D11
# smoke tests on each push and pull request.
# Runner GPU is the Microsoft Basic Render Driver: VRAM checks are skipped there, Vulkan is not built.
name: ci
on:
  push:
    branches: [master]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    uses: ./.github/workflows/dc.yml
    with:
      os: windows-2022
      commands: '["powershell -NoProfile -ExecutionPolicy Bypass -File tools/toolchain.ps1 -AcceptLicense && powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 -Test"]'
