# Fetches the toolchain (tools/toolchain.ps1), builds everything and runs the Rust and D3D11
# smoke tests on each push and pull request.
# Runner GPU is the Microsoft Basic Render Driver: VRAM checks are skipped there, Vulkan is not built.
# Cached: the toolchain (keyed on its pins) and the build trees (latest run). Each cached build
# tree records its commit; tools/ci_mtime.sh back-dates the sources unchanged since then, so only
# changed sources rebuild.
name: ci
on:
  push:
    branches: [master]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"   # incremental data is never reused on CI, only grows the cache
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tools/ci_mtime.sh diffs against the cached build commit
      - uses: actions/cache@v6
        with:
          path: |
            .toolchain/windows-x64
            !.toolchain/windows-x64/dl
          key: toolchain-windows-x64-${{ hashFiles('tools/toolchain.ps1', 'rust-toolchain.toml') }}
      - uses: actions/cache@v6
        with:
          path: build/windows-x64
          key: build-windows-x64-${{ github.sha }}
          restore-keys: build-windows-x64-
      - run: sh tools/ci_mtime.sh build/windows-x64
        shell: bash
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/toolchain.ps1 -AcceptLicense
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 -Test
      - run: echo "$GITHUB_SHA" > build/windows-x64/ci-sha
        shell: bash
  # Cross-build from Linux (tools/toolchain.sh + build.sh) so that path does not break unnoticed;
  # no tests (they need Windows).
  linux-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tools/ci_mtime.sh diffs against the cached build commit
      - uses: actions/cache@v6
        with:
          path: |
            .toolchain/linux-x64
            !.toolchain/linux-x64/dl
          key: toolchain-linux-x64-${{ hashFiles('tools/toolchain.sh', 'rust-toolchain.toml') }}
      - uses: actions/cache@v6
        with:
          path: build/linux-x64
          key: build-linux-x64-${{ github.sha }}
          restore-keys: build-linux-x64-
      - run: sh tools/ci_mtime.sh build/linux-x64
        shell: bash
      - run: sh tools/toolchain.sh --accept-license
      - run: sh build.sh
      - run: echo "$GITHUB_SHA" > build/linux-x64/ci-sha
